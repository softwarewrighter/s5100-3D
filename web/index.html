<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IBM 5100</title><script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>body{margin:0;padding:16px;background:#181a1f;color:#eee;font:16px system-ui;text-align:center}model-viewer{display:block;width:100%;height:70vh;background:#252932}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px}button,a{padding:8px;color:#eee;background:#33415a;border:1px solid #789;border-radius:5px}#status{min-height:1.5em}</style>
<h1>IBM 5100</h1><model-viewer id="mv" camera-controls environment-image="neutral" shadow-intensity="1" alt="IBM 5100"></model-viewer>
<nav><button data-preset="0">Overview</button><button data-preset="1">Operator</button><button data-preset="2">Front panel</button><button data-preset="3">Keyboard</button><button data-preset="4">Tape</button><button data-action="zoom-in">Zoom in</button><button data-action="zoom-out">Zoom out</button><button data-action="up">Elevation up</button><button data-action="down">Elevation down</button><button data-action="pan-up">Pan up</button><button data-action="pan-down">Pan down</button><button data-action="rotate">Resume rotation</button><button data-action="reset">Reset</button></nav><p>W/S zoom · A/D or ←/→ orbit · ↑/↓ elevation · I/K pan vertically · Space rotation · R reset</p>
<p id="status" role="status">Loading model…</p><p>Drag to orbit; right drag to pan; scroll or pinch to zoom. Viewer requires network access for model-viewer.</p>
<script src="viewer-controls.js"></script><script>
const config={"model": "ibm5100.glb", "views": [{"name": "Overview", "orbit": "0.711459125739508rad 1.3548301171970114rad 1.959948978927768m", "target": "0m 0.93m 0m"}, {"name": "Operator", "orbit": "0.0rad 1.4024061696473669rad 1.014347080638575m", "target": "0m 0.98m 0.25m"}, {"name": "Front panel", "orbit": "0.0rad 1.445246589686371rad 1.0381714694596456m", "target": "0m 1.0m 0.32m"}, {"name": "Keyboard", "orbit": "0.0rad 1.463106455962076rad 0.7443117626371357m", "target": "0m 0.94m 0.31m"}, {"name": "Tape", "orbit": "0.5475622359399976rad 1.4464947166550093rad 0.9678842906050288m", "target": "0.12m 1.0m 0.33m"}], "hatch": false};
customElements.whenDefined('model-viewer').then(()=>{
 const mv=document.getElementById('mv'), first=config.views[0];
 mv.cameraOrbit=first.orbit;mv.cameraTarget=first.target;
 const controls=ModelControls.attach(mv,{orbit:first.orbit,target:first.target,rotateButton:document.querySelector('[data-action="rotate"]')});
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=controls.actions[b.dataset.action]);
 document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const v=config.views[Number(b.dataset.preset)];controls.setView(v.orbit,v.target)});
 mv.addEventListener('load',()=>document.getElementById('status').textContent='Ready');
 mv.addEventListener('error',()=>document.getElementById('status').textContent='Model load failed. Check the build output and serve this directory over HTTP.');
 mv.src=config.model;
 if(config.hatch){let open=false;const b=document.getElementById('hatch');b.onclick=()=>{open=!open;mv.src=open?'ibm1130-open.glb':config.model;b.textContent=open?'Close service hatch':'Open service hatch'}}
});
</script></html>
